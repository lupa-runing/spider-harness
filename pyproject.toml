[project]
name = "spider-harness"
version = "0.1.0"
description = "LangGraph-powered agent harness feeding the SPIDER dashboard with real events"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langgraph>=0.2.60",
    "langchain-core>=0.3.29",
    "langchain-openai>=0.3.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "sse-starlette>=2.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "edge-tts>=7.0.0",
    "pillow>=11.0.0",
]

[dependency-groups]
dev = []

[tool.uv]
package = false
